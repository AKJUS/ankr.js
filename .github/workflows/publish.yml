name: Publish

on:
  release:
    types: [released, prereleased]
  # A retry path. Without it, a failed release run can only be retried by moving
  # or recreating the tag, because the run is bound to the ref that fired it.
  workflow_dispatch: {}

permissions:
  contents: read
  # The credential. npm exchanges the OIDC token minted here for a short-lived,
  # single-publish registry token, so without this the publish cannot authenticate
  # at all. It is also what lets npm attach a provenance attestation.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The npm trusted publisher for @ankr.com/ankr.js is bound to this
    # environment, so the OIDC token has to carry it. Without the claim npm
    # does not recognise the publisher, no registry token is issued, and the
    # upload goes out unauthenticated and comes back 404.
    environment: prod

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.0. Node 18 is
          # also past end of life and its bundled npm predates OIDC entirely.
          node-version: 24
          # Still required: it is what points npm at the registry for the token
          # exchange, not a leftover from the token era.
          registry-url: https://registry.npmjs.org
      # yarn is used for the install only, because the lockfile is yarn's. Every
      # other script runs through npm: setup-node's registry-url writes an .npmrc
      # holding `_authToken=${NODE_AUTH_TOKEN}`, npm tolerates that variable being
      # unset and yarn 1 exits with an error instead of ignoring the line. The
      # publish step has no token by design, so the variable is unset for the whole
      # job, and a step-scoped placeholder here is enough to get yarn through.
      # Nothing in this install needs registry auth: every dependency is public.
      - run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: unused
      - run: npm run build
      # No `env:` and no NODE_AUTH_TOKEN: npm mints a credential per run from the
      # OIDC token, bound on the npm side to this repository and workflow file.
      # The placeholder on the install step above is step-scoped and not visible
      # here, which is what keeps this step on OIDC.
      #
      # `npm publish` rather than `yarn publish`: yarn 1 cannot do OIDC, and it also
      # treats `publish` as a version-bumping command that prompts for input.
      #
      # Provenance is left ON, which is why `repository` in package.json had to stop
      # pointing at the old Ankr-network URL: npm requires it to match the repository
      # the publish runs from, and fails the publish otherwise.
      - run: npm publish --access public ${{ github.event.release.prerelease && '--tag alpha' || '' }}
